[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-statement-sheets-sync"
version = "0.1.0"
description = "Local reconciliation and reviewed Google Sheets import preparation"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0", "mypy>=1.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_statement_sheets_sync"]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.15"
files = ["src"]
